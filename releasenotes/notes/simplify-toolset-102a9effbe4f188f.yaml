---
upgrade:
  - |
    Toolset concatenation with ``+`` has been removed, along with the internal wrapper class it produced
    (``_ToolsetWrapper``). To use multiple Toolsets together, pass them as a list wherever tools are accepted,
    which keeps each Toolset intact with its own lifecycle and serialization: ``Agent(tools=[toolset_a,
    toolset_b])``. To deliberately merge simple Toolsets into one, unpack them explicitly:
    ``Toolset([*toolset_a, *toolset_b])``. Serialized pipelines containing the removed wrapper
    (``haystack.tools.toolset._ToolsetWrapper``) can no longer be deserialized: recreate them by passing the
    Toolsets as a list.
  - |
    ``Toolset.add()`` now accepts only ``Tool`` instances. Adding a whole Toolset used to flatten it, detaching
    its tools from the Toolset that manages their lifecycle and serialization, and silently dropped the tools of
    lazily-loading Toolsets that were not warmed up yet. To combine Toolsets, pass them as a list wherever tools
    are accepted: ``Agent(tools=[toolset_a, toolset_b])``.
  - |
    ``Toolset.spawn()`` and ``Toolset.get_selectable_tools()`` have been removed from the base class, and the
    per-run isolation machinery is now internal. Plain Toolsets hold no run-scoped state, so they are shared
    across runs directly and reduced to their matching Tools on name selection. ``SearchableToolset`` (the one
    Toolset with run-scoped state) is copied per run internally; its per-run behavior, including tool-name
    selection via ``Agent.run(tools=[...])``, is unchanged. Third-party Toolset subclasses that overrode
    ``spawn()`` no longer take part in per-run copying and behave as plain Toolsets.
  - |
    ``Toolset.warm_up()`` no longer tracks an internal "warmed up" flag. Following the framework-wide convention,
    ``warm_up()`` can be called multiple times and implementations are responsible for their own idempotence:
    the default implementation delegates to the tools' own idempotent ``warm_up()``, and Toolset subclasses that
    load tools dynamically should guard on their own state (for example ``if self._client is not None: return``).
    Subclasses that relied on the private ``Toolset._is_warmed_up`` attribute must define their own guard.
enhancements:
  - |
    Simplified ``Toolset`` to a plain collection of Tools: iteration, length, and membership checks now always
    reflect the full tool list, with no hidden run-scoped filtering. The per-run machinery lives internally in
    the Toolsets that need it (currently only ``SearchableToolset``).
