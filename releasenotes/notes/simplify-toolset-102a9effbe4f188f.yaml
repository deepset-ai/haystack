---
upgrade:
  - |
    Combining Toolsets with ``+`` or ``Toolset.add(toolset)`` is no longer supported. Pass Toolsets as a list
    wherever tools are accepted instead: ``Agent(tools=[toolset_a, toolset_b])``.
  - |
    ``Toolset.spawn()`` has been removed. It was only needed internally: plain Toolsets are shared across runs,
    and ``SearchableToolset`` handles its own per-run isolation.
  - |
    Haystack can call ``warm_up()`` on Tools and Toolsets more than once, for example before every run.
    Previously ``Toolset`` silently absorbed the repeated calls with an internal flag; now every call reaches
    your ``warm_up()``. If your custom Tool or Toolset does expensive work there (connecting to a server,
    loading a model), make sure a second call does nothing: check whether the work is already done and return
    early, for example ``if self._client is not None: return``.
