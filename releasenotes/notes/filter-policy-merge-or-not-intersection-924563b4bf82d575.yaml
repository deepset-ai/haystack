---
upgrade:
  - |
    ``FilterPolicy.MERGE`` now intersects initialization and runtime logical filters when both use ``OR`` or
    ``NOT``. Callers that relied on the previous broader result should construct a single explicit ``OR`` filter
    containing all alternatives and pass it with ``FilterPolicy.REPLACE`` instead.
fixes:
  - |
    Fixed ``FilterPolicy.MERGE`` returning documents that the initialization filters exclude. When the
    initialization and runtime filters were both logical filters sharing an ``OR`` or ``NOT`` operator, their
    conditions were concatenated, which unions the two filters rather than applying both. They are now combined
    under an ``AND`` so each filter still restricts the result. Merging two ``AND`` filters is unchanged.
