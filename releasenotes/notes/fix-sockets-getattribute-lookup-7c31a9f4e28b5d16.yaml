---
enhancements:
  - |
    Removed the ``Sockets.__getattribute__`` override. It looked up a ``_sockets``
    attribute that no instance has, so on every attribute access it raised and
    caught ``AttributeError`` and never returned a socket; socket access has always
    gone through the copies ``__init__`` and ``__setitem__`` put in ``__dict__``.
    Without the override, accessing a socket attribute such as
    ``component.__haystack_input__.query`` is about 14x faster.
