---
fixes:
  - |
    ``RecursiveDocumentSplitter``'s word-mode fixed-size fallback no longer counts a run of
    whitespace (e.g. a double space, tab, or page break) as a word, so it no longer produces
    chunks smaller than ``split_length``. It also no longer emits a whitespace-only chunk when
    the text ends in whitespace right after a chunk boundary; that trailing whitespace is now
    attached to the previous chunk instead.

    This changes the exact chunk boundaries and chunk count produced by the word-unit fallback
    for any text containing such whitespace runs. Documents already split and indexed under the
    old behavior will produce different chunks if re-split after upgrading, so re-index any
    document store that relies on stable chunk boundaries from this fallback path.
