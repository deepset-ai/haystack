---
fixes:
  - |
    `DocumentJoiner` with `join_mode="distribution_based_rank_fusion"` now handles a Document whose score is `NaN`
    or infinite the way it handles a missing score: the value is treated as `0` when the statistics of the list are
    computed. Before this change one such score made the mean and the standard deviation of the list non-finite,
    which turned the rescaled score of every Document in that list into `NaN` without raising or logging anything.
