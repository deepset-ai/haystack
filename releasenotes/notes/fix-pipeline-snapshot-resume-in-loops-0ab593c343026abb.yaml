---
upgrade:
  - |
    ``PipelineSnapshot.pipeline_state.inputs`` changed shape. It used to store one flattened value per socket,
    ``{component: {socket: value}}``. It now stores the pipeline's internal inputs, keeping the component that sent
    each one and keying the inputs a socket received by their position:
    ``{component: {socket: {"0": {"sender": ..., "value": ...}}}}``. Positions are used instead of a list so that
    each input carries its own type schema, which a list cannot do. ``PipelineState`` gained an ``inputs_format``
    field recording which of the two shapes a snapshot uses. The same applies to ``BreakpointException.inputs``,
    which returns that field.

    You are affected if you read ``pipeline_state.inputs`` (or ``BreakpointException.inputs``) directly, for example
    to display or post-process a snapshot. Resuming a pipeline with ``Pipeline.run(pipeline_snapshot=...)`` is not
    affected, and neither is code that only passes snapshots around or persists them.

    To adapt, read through the position and unwrap the sender:

    .. code-block:: python

        from haystack.utils import _deserialize_value_with_schema

        inputs = _deserialize_value_with_schema(snapshot.pipeline_state.inputs)
        value = inputs["my_component"]["my_socket"]["0"]["value"]

    Snapshots written by earlier versions of Haystack have ``inputs_format`` set to ``None`` and keep the flattened
    shape, so branch on that field if you need to handle both.
fixes:
  - |
    Fixed resuming a ``Pipeline`` from a ``pipeline_snapshot`` that was taken on a component's second or later visit,
    which failed with ``PipelineComponentsBlockedError: Cannot run pipeline - all components are blocked``. A snapshot
    stored only the values of the pipeline's inputs and dropped the information about which component had sent each
    one, so on resume every restored input looked like it came from outside the pipeline, and such an input can only
    trigger a component on its first visit. Snapshots now record the sender of each input. Snapshots created by
    earlier versions of Haystack can still be resumed on a first visit, as before; re-create them to resume from a
    later visit of a loop.
  - |
    Fixed a resumed ``Pipeline`` passing malformed inputs to the component the snapshot was taken on, whenever that
    component ran more than once after the resume, for example inside a loop. Every visit after the first reused the
    handling meant only for the paused visit and skipped the regular input consumption, so a variadic component could
    receive a bare value where it expected a list, raising errors such as
    ``TypeError: object of type 'int' has no len()`` from a ``BranchJoiner``. This affected snapshots taken at any
    visit count, including the first.
