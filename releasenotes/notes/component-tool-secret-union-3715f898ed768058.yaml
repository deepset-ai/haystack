---
fixes:
  - |
    Fixed ``ComponentTool`` failing when a component input is typed as ``str`` or
    ``Secret`` and the value arrives through ``inputs_from_state``. Pydantic
    could not build a schema for ``Secret``, so invoking the tool raised a
    schema generation error whether the value was a plain string or a
    ``Secret``. Such values now pass through to the component unchanged.
