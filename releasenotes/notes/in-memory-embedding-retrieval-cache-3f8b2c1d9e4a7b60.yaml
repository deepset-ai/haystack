---
enhancements:
  - |
    ``InMemoryDocumentStore.embedding_retrieval`` and ``InMemoryEmbeddingRetriever`` are much faster on repeated
    queries. The store used to convert every Document embedding to a NumPy array on each query, which took most of
    the query time. It now keeps the array from the previous query and reuses it until Documents are written,
    overwritten, or deleted, or a Document gets a new ``embedding``. With 10,000 Documents and 384-dimensional
    embeddings, a query takes about 3 ms instead of 52 ms. Editing an embedding list in place after writing the
    Document is not detected; assign a new list or write the Document again instead.
