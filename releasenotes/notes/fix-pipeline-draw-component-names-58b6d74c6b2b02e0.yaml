---
fixes:
  - |
    ``Pipeline.draw()`` and ``Pipeline.show()`` no longer fail for component names that Mermaid can't use as node
    IDs. Component names were used as node IDs as they are, so a name with a space or a parenthesis (for example
    ``"query embedder"``), or a Mermaid keyword such as ``end`` or ``graph``, made the Mermaid server reject the
    diagram. A component named ``input`` or ``output`` raised a ``KeyError``, and one named ``i`` or ``o`` was merged
    into the pipeline's input or output node in the drawing. SuperComponent names had the same problem with
    ``super_component_expansion=True``. Such names now get a valid node ID, and the diagram still shows the original
    name.
