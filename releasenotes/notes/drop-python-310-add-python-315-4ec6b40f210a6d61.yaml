---
upgrade:
  - |
    Dropped support for Python 3.10 since it reaches End of Life (EOL) in October 2026.
    The minimum supported Python version is now 3.11.
    If you are on Python 3.10, upgrade your Python version before upgrading Haystack.
enhancements:
  - |
    Haystack now officially supports Python 3.15.
fixes:
  - |
    ``Pipeline.run_async()`` and ``Pipeline.run_async_generator()`` now pass the outputs of components that finish at
    the same time to a variadic input, such as the ``documents`` input of ``DocumentJoiner``, in the order the
    components were scheduled.
    Previously, the order could differ between runs and platforms, which changed the order of joined lists.
    The changed order showed up on Python 3.15 on Linux.
