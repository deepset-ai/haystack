---
fixes:
  - |
    ``logger.exception()`` on loggers from ``haystack.logging.getLogger`` now logs the active traceback, as the
    standard library does. Previously it logged only the message, without the stack trace, in both JSON and console
    output. On Python 3.10, these records could also point at ``haystack/logging.py`` instead of the calling line.
    Passing ``exc_info`` explicitly still works.
