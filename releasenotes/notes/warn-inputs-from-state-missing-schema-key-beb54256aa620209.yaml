---
deprecations:
  - |
    ``Agent`` now emits a ``FutureWarning`` at the start of a run when a tool's ``inputs_from_state`` reads a key
    that is not in the Agent's ``state_schema``. The Agent's state only holds keys declared in ``state_schema``, so
    the tool never receives that value and runs with its default, or fails if the parameter has none.
    Starting with Haystack 3.7, this will raise a ``ValueError``.

    To fix the warning, add the key to ``state_schema``. For example, the Mem0 memory tools read ``user_id`` from
    state by default:

    .. code-block:: python

        # Requires the OPENAI_API_KEY and MEM0_API_KEY environment variables
        from haystack.components.agents import Agent
        from haystack.components.generators.chat import OpenAIResponsesChatGenerator
        from haystack.dataclasses import ChatMessage
        from haystack_integrations.memory_stores.mem0 import Mem0MemoryStore
        from haystack_integrations.tools.mem0 import Mem0MemoryRetrieverTool

        agent = Agent(
            chat_generator=OpenAIResponsesChatGenerator(),
            tools=[Mem0MemoryRetrieverTool(memory_store=Mem0MemoryStore())],
            state_schema={"user_id": {"type": str}},
        )
        result = agent.run(messages=[ChatMessage.from_user("What do you remember about me?")], user_id="alice")
