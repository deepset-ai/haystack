---
features:
  - |
    Added the experimental ``SummarizationCompactor`` for preserving useful context from long-running Agents instead
    of dropping older messages outright. It uses a separate Chat Generator to summarize the conversation in four tiers,
    spending history before the Agent's current task and, within each of the two, summarizing original messages before
    combining existing summaries with each other: the oldest historical turns, then the historical summaries left
    behind, then the oldest steps of the current task, then the current-task summaries left behind. Because combining
    comes last in each region, summaries accumulate instead of being rewritten on every compaction, which keeps
    already-summarized text from being summarized again and again.

    Leading system messages, the latest user task, and a configurable number of recent Agent steps are preserved, and
    assistant tool calls always stay together with all of their tool results. This is also the floor that compaction
    cannot go below: once each region holds a single combined summary, ``compact`` reports that no further reduction is
    possible however small the target is. Each summary records the tier it came from and the number of messages it
    replaced under the ``context_compaction`` key in its ``meta``.

    ``max_summary_tokens`` reserves space for each generated summary, and defaults to a value that leaves room for a
    reasoning model, since providers count a reasoning model's thinking against this same output budget. If the
    generator stops on that limit before finishing, the summary is still used and a warning says it was cut off.
    Chat Generators that advertise Haystack's
    provider-neutral output-token mapping receive that limit at runtime. If this mapping is unavailable, the compactor
    logs a warning. When that warning appears, set the provider-specific output-token limit to the same value when
    initializing the summary Chat Generator. The prompt also states the limit. Generated summaries are only applied
    when they reduce the measured conversation size. By default, a failed summarization keeps any progress already made
    and logs a warning; set ``raise_on_failure=True`` to propagate the error instead.

    .. code-block:: python

        from haystack.components.agents import Agent
        from haystack.components.generators.chat import OpenAIResponsesChatGenerator
        from haystack.hooks.compaction import CompactionHook, SummarizationCompactor

        agent_generator = OpenAIResponsesChatGenerator(model="gpt-5.4")
        summary_generator = OpenAIResponsesChatGenerator(model="gpt-5.4-nano")

        compaction_hook = CompactionHook(
            compactor=SummarizationCompactor(
                chat_generator=summary_generator,
                min_keep_steps=2,
                max_summary_tokens=4_096,
            ),
            context_window=400_000,
            compact_at=0.7,
            compact_to=0.4,
        )

        agent = Agent(
            chat_generator=agent_generator,
            hooks={"before_llm": [compaction_hook]},
        )
